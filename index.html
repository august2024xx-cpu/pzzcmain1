<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Coin Crypto - 4 Image Carousel (Fail-Safe)</title>
<style>
  :root {
    --neon-green: #39ff14;
    --neon-green-glow: rgba(57, 255, 20, 0.8);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #020402;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .carousel-card {
    width: 100%;
    max-width: 700px;
    background: #000;
    border: 4px solid var(--neon-green);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 0 20px var(--neon-green-glow);
    text-align: center;
  }

  .carousel-title {
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 900;
    color: var(--neon-green);
    text-shadow: 0 0 10px var(--neon-green);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  /* CAROUSEL VIEWPORT */
  .carousel-viewport {
    position: relative;
    width: 100%;
    height: 400px;
    overflow: hidden;
    border: 2px solid var(--neon-green);
    border-radius: 12px;
    background: #050505;
  }

  /* SLIDES TRACK USING CSS ANIMATION */
  .carousel-track {
    display: flex;
    width: 400%; /* 100% width for each of the 4 pictures */
    height: 100%;
    animation: autoSlide 40s infinite ease-in-out;
  }

  .slide {
    width: 25%;
    height: 100%;
    flex-shrink: 0;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 10-SECOND AUTOMATIC SWAPPING ANIMATION (40s TOTAL LOOP) */
  @keyframes autoSlide {
    0%, 22%    { transform: translateX(0%); }       /* Picture 1 */
    25%, 47%   { transform: translateX(-25%); }     /* Picture 2 */
    50%, 72%   { transform: translateX(-50%); }     /* Picture 3 */
    75%, 97%   { transform: translateX(-75%); }     /* Picture 4 */
    100%       { transform: translateX(0%); }       /* Loop back to Picture 1 */
  }

  /* MANUAL OVERRIDE TARGETS */
  #target-1:target ~ .carousel-viewport .carousel-track { animation: none; transform: translateX(0%); }
  #target-2:target ~ .carousel-viewport .carousel-track { animation: none; transform: translateX(-25%); }
  #target-3:target ~ .carousel-viewport .carousel-track { animation: none; transform: translateX(-50%); }
  #target-4:target ~ .carousel-viewport .carousel-track { animation: none; transform: translateX(-75%); }

  /* NAVIGATION ARROWS */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.85);
    color: var(--neon-green);
    border: 2px solid var(--neon-green);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
    z-index: 10;
    box-shadow: 0 0 10px var(--neon-green-glow);
    transition: background 0.2s, transform 0.2s;
  }

  .arrow:hover {
    background: var(--neon-green);
    color: #000;
    transform: translateY(-50%) scale(1.1);
  }

  .arrow-left { left: 12px; }
  .arrow-right { right: 12px; }

  /* ARROW CONTROLS VISIBILITY STATE */
  .arrow-set {
    display: none;
  }

  /* Default visible arrows during auto-loop */
  .default-arrows {
    display: block;
  }

  #target-1:target ~ .carousel-viewport .arrow-set { display: none; }
  #target-1:target ~ .carousel-viewport .arrows-1 { display: block; }

  #target-2:target ~ .carousel-viewport .arrow-set { display: none; }
  #target-2:target ~ .carousel-viewport .arrows-2 { display: block; }

  #target-3:target ~ .carousel-viewport .arrow-set { display: none; }
  #target-3:target ~ .carousel-viewport .arrows-3 { display: block; }

  #target-4:target ~ .carousel-viewport .arrow-set { display: none; }
  #target-4:target ~ .carousel-viewport .arrows-4 { display: block; }

  /* BOTTOM NUMBER INDICATORS */
  .carousel-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
  }

  .nav-btn {
    color: var(--neon-green);
    text-decoration: none;
    font-weight: bold;
    padding: 6px 16px;
    border: 2px solid var(--neon-green);
    border-radius: 8px;
    background: #000;
    box-shadow: 0 0 6px var(--neon-green-glow);
    transition: 0.2s;
  }

  .nav-btn:hover {
    background: var(--neon-green);
    color: #000;
  }

  @media (max-width: 600px) {
    .carousel-viewport {
      height: 260px;
    }
    .arrow {
      width: 38px;
      height: 38px;
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<div class="carousel-card">
  <div class="carousel-title">🍕 PIZZA COIN GALLERY 🍕</div>

  <!-- TARGET ANCHORS FOR MANUAL OVERRIDE -->
  <div id="target-1"></div>
  <div id="target-2"></div>
  <div id="target-3"></div>
  <div id="target-4"></div>

  <div class="carousel-viewport">
    
    <!-- ARROWS (DEFAULT AUTO-LOOP STATE) -->
    <div class="arrow-set default-arrows">
      <a href="#target-4" class="arrow arrow-left">❮</a>
      <a href="#target-2" class="arrow arrow-right">❯</a>
    </div>

    <!-- ARROWS FOR SLIDE 1 OVERRIDE -->
    <div class="arrow-set arrows-1">
      <a href="#target-4" class="arrow arrow-left">❮</a>
      <a href="#target-2" class="arrow arrow-right">❯</a>
    </div>

    <!-- ARROWS FOR SLIDE 2 OVERRIDE -->
    <div class="arrow-set arrows-2">
      <a href="#target-1" class="arrow arrow-left">❮</a>
      <a href="#target-3" class="arrow arrow-right">❯</a>
    </div>

    <!-- ARROWS FOR SLIDE 3 OVERRIDE -->
    <div class="arrow-set arrows-3">
      <a href="#target-2" class="arrow arrow-left">❮</a>
      <a href="#target-4" class="arrow arrow-right">❯</a>
    </div>

    <!-- ARROWS FOR SLIDE 4 OVERRIDE -->
    <div class="arrow-set arrows-4">
      <a href="#target-3" class="arrow arrow-left">❮</a>
      <a href="#target-1" class="arrow arrow-right">❯</a>
    </div>

    <!-- SLIDES TRACK (FALLBACK EMBEDDED PLACEHOLDERS) -->
    <div class="carousel-track">
      <div class="slide">
        <img src="pic1.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'400\' viewBox=\'0 0 600 400\'><rect width=\'100%\' height=\'100%\' fill=\'%23001500\'/><text x=\'50%\' y=\'45%\' font-family=\'Arial\' font-size=\'32\' font-weight=\'bold\' fill=\'%2339ff14\' text-anchor=\'middle\'>PICTURE 1 (pic1.png)</text><text x=\'50%\' y=\'60%\' font-family=\'Arial\' font-size=\'48\' text-anchor=\'middle\'>🍕</text></svg>';" alt="Picture 1">
      </div>
      <div class="slide">
        <img src="pic2.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'400\' viewBox=\'0 0 600 400\'><rect width=\'100%\' height=\'100%\' fill=\'%23002000\'/><text x=\'50%\' y=\'45%\' font-family=\'Arial\' font-size=\'32\' font-weight=\'bold\' fill=\'%2339ff14\' text-anchor=\'middle\'>PICTURE 2 (pic2.png)</text><text x=\'50%\' y=\'60%\' font-family=\'Arial\' font-size=\'48\' text-anchor=\'middle\'>🚀</text></svg>';" alt="Picture 2">
      </div>
      <div class="slide">
        <img src="pic3.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'400\' viewBox=\'0 0 600 400\'><rect width=\'100%\' height=\'100%\' fill=\'%23001500\'/><text x=\'50%\' y=\'45%\' font-family=\'Arial\' font-size=\'32\' font-weight=\'bold\' fill=\'%2339ff14\' text-anchor=\'middle\'>PICTURE 3 (pic3.png)</text><text x=\'50%\' y=\'60%\' font-family=\'Arial\' font-size=\'48\' text-anchor=\'middle\'>📈</text></svg>';" alt="Picture 3">
      </div>
      <div class="slide">
        <img src="pic4.png" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'400\' viewBox=\'0 0 600 400\'><rect width=\'100%\' height=\'100%\' fill=\'%23002000\'/><text x=\'50%\' y=\'45%\' font-family=\'Arial\' font-size=\'32\' font-weight=\'bold\' fill=\'%2339ff14\' text-anchor=\'middle\'>PICTURE 4 (pic4.png)</text><text x=\'50%\' y=\'60%\' font-family=\'Arial\' font-size=\'48\' text-anchor=\'middle\'>💰</text></svg>';" alt="Picture 4">
      </div>
    </div>

  </div>

  <!-- MANUAL SELECTOR BUTTONS -->
  <div class="carousel-nav">
    <a href="#target-1" class="nav-btn">1</a>
    <a href="#target-2" class="nav-btn">2</a>
    <a href="#target-3" class="nav-btn">3</a>
    <a href="#target-4" class="nav-btn">4</a>
  </div>
</div>

</body>
</html>
